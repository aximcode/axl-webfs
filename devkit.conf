# axl-webfs devkit manifest — declares what uefi-devkit stages from
# this project, how to name the binaries on the image, and how to
# build them when invoked via `uefi-devkit/build.sh --rebuild`.
#
# Read by uefi-devkit's parse_manifest() at stage time. The build:
# line delegates to uefi-devkit's scripts/build-make-both.sh helper
# (referenced via $PROJECT_ROOT — expanded at orchestrator-eval
# time), which loops both arches against $AXL_DIR/out and absorbs
# the orchestrator's trailing `--arch X64 --arch AARCH64` positional
# args.

desc: axl-webfs   Remote filesystem + HTTP file server

build: $PROJECT_ROOT/scripts/build-make-both.sh

# axl-webfs.efi embeds both the serve and mount DXE drivers via
# axl-cc --embed and extracts them at runtime via
# axl_service_start_embedded — see the Makefile. Don't stage the
# loose *-dxe.efi files: besides wasting ~1.1 MB per arch, a staged
# copy WINS over the embedded one. axl_service_start_embedded runs
# the SDK's 4-path disk search before it ever reaches the embedded
# blob, and search candidate #1 is <image_dir>/<driver_name> —
# i.e. exactly beside the staged ${arch}/axl-webfs.efi. So a loose
# copy is not a harmless duplicate, it is what actually boots.
#
# Consequence for anyone re-staging over an image built before
# 2026-06-16 (commit 1aa5133, which dropped these two lines): the
# stale ${arch}/axl-webfs-*-dxe.efi left behind still wins, and the
# box silently runs the OLD driver against the NEW launcher. Delete
# them from the ESP by hand. (1aa5133's own message claims the loose
# binaries "were never actually used at boot" — that is backwards;
# they were candidate #1 and were precisely what ran.)
#
# A future SDK embedded-only deploy mode would let the launcher opt
# out of the disk search entirely; see
# sdk-prompts/2026-07-27-v3-service-driver-lifecycle-handoff.md.
binary  build/axl/${arch}/axl-webfs.efi             ${arch}/axl-webfs.efi
script  scripts/xfer-server.py                      scripts/xfer-server.py
