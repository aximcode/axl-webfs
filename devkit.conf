# axl-webfs devkit manifest — declares what uefi-devkit stages from
# this project, how to name the binaries on the image, and how to
# build them when invoked via `uefi-devkit/build.sh --rebuild`.
#
# Read by uefi-devkit's parse_manifest() at stage time. The build:
# line delegates to uefi-devkit's scripts/build-make-both.sh helper
# (referenced via $PROJECT_ROOT — expanded at orchestrator-eval
# time), which loops both arches against $AXL_DIR/out and absorbs
# the orchestrator's trailing `--arch X64 --arch AARCH64` positional
# args.

desc: axl-webfs   Remote filesystem + HTTP file server

build: $PROJECT_ROOT/scripts/build-make-both.sh

# axl-webfs.efi embeds both the serve and mount DXE drivers via
# axl-cc --embed and extracts them at runtime via
# axl_service_start_embedded — see the Makefile. Don't stage the
# loose *-dxe.efi files; they waste ~1.1 MB per arch and are never
# what boots.
#
# Both deploys now set AxlServiceDeploy.embedded_only (SDK 5554244b),
# so the launcher loads its baked-in blob directly and the SDK's
# 4-path disk search is skipped entirely. That closes a hazard that
# was live until then: search candidate #1 is <image_dir>/<driver_name>
# — exactly beside the staged ${arch}/axl-webfs.efi — so a stale loose
# copy left on an ESP by a pre-2026-06-16 staging silently WON, running
# the OLD driver against the NEW launcher. (1aa5133's message claims
# the loose binaries "were never actually used at boot"; that was
# backwards — they were candidate #1 and were precisely what ran.)
#
# Verified RED/GREEN under OVMF with a loadable stale copy staged
# beside the launcher: without the flag the SDK logs
# `loaded 'fs0:\axl-webfs-serve-dxe.efi'`, with it `loaded '<embedded>'`.
# So an old ESP no longer needs hand-cleaning — but the loose files are
# still dead weight, which is why they stay out of the manifest.
binary  build/axl/${arch}/axl-webfs.efi             ${arch}/axl-webfs.efi
script  scripts/xfer-server.py                      scripts/xfer-server.py
